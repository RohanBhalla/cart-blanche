[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartblanche"
version = "0.1.0"
description = "Personalized, attack-robust shopping agent with an evaluation harness"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "litellm>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cartblanche*"]

[tool.setuptools.package-data]
"cartblanche.env" = ["data/*.json", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
